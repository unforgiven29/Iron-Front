name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_configured: ${{ steps.pages.outputs.base_url != '' && steps.pages.outcome == 'success' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check whether GitHub Pages is enabled
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Explain Pages setup requirement
        if: steps.pages.outcome != 'success'
        run: |
          echo "The static site built successfully, but GitHub Pages is not enabled for this repository."
          echo "Enable it in Settings > Pages > Build and deployment > Source > GitHub Actions."
          echo "The next push or manual workflow run will deploy automatically."
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_configured == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
